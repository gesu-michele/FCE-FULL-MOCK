<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambridge B2 First (FCE) - Full Mock Examination Suite - Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'AnanthaSignature';
      src: url('Anantha%20Signature%20For%20Personal%20Use.ttf') format('truetype'),
           url('Anantha Signature For Personal Use.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-canvas: #040914;
      --bg-panel: #0a1324;
      --bg-card: #101d36;
      --bg-card-inner: #070e1c;
      --border-subtle: #1c2e4c;
      --border-gold: rgba(212, 175, 55, 0.4);
      --accent-gold: #d4af37;
      --accent-gold-soft: rgba(212, 175, 55, 0.12);
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --cambridge-brand-red: #c8102e;
      --cambridge-brand-dark: #0a1b3a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --shadow-deep: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 90% 10%, rgba(37, 99, 235, 0.18) 0%, transparent 55%),
        radial-gradient(circle at 10% 90%, rgba(212, 175, 55, 0.12) 0%, transparent 55%),
        linear-gradient(to bottom, #030710, #081120);
      background-attachment: fixed;
    }

    #app-viewport {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .top-nav {
      height: 64px;
      background: rgba(6, 12, 23, 0.95);
      border-bottom: 1px solid rgba(28, 46, 76, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .cambridge-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #ffffff;
      padding: 5px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      user-select: none;
    }

    .cambridge-shield {
      width: 17px;
      height: 17px;
      fill: var(--cambridge-brand-red);
    }

    .cambridge-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--cambridge-brand-dark);
      letter-spacing: -0.2px;
      line-height: 1;
      text-transform: uppercase;
    }

    .cambridge-level {
      font-size: 9px;
      font-weight: 800;
      color: var(--cambridge-brand-red);
      margin-top: -3px;
    }

    .nav-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      border-left: 1px solid var(--border-subtle);
      padding-left: 14px;
      font-family: 'JetBrains Mono', monospace;
    }

    .nav-brand-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .coin-display {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid var(--accent-gold);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .candidate-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent-blue-light);
      background: rgba(37, 99, 235, 0.14);
      border: 1px solid rgba(96, 165, 250, 0.35);
      padding: 5px 12px;
      border-radius: 6px;
    }

    .screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .slide {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
    }

    /* COVER SCREEN */
    .cover-fullscreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 80px 42px 80px;
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
    }

    .cover-top-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .cover-headings-group {
      margin-bottom: 12px;
    }

    .main-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .main-task-title {
      font-family: 'Inter', sans-serif;
      font-size: clamp(40px, 5.5vw, 76px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .welcome-text-block {
      max-width: 920px;
      border-left: 3px solid var(--accent-gold);
      padding-left: 26px;
      margin-top: 42px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .welcome-en {
      font-size: clamp(15.5px, 1.2vw, 18.5px);
      color: #f1f5f9;
      line-height: 1.68;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .cover-bottom-row {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 26px;
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: nowrap;
      gap: 32px;
      width: 100%;
    }

    .signature-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .signature-name-wrapper {
      margin-bottom: 10px;
      padding-bottom: 4px;
      white-space: nowrap;
    }

    .signature-name {
      font-family: 'AnanthaSignature', cursive, sans-serif;
      font-size: clamp(34px, 3.4vw, 54px);
      font-weight: normal;
      color: #ffffff;
      line-height: 1.35;
      display: inline-block;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    .signature-roles {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .signature-roles span {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(11px, 0.88vw, 12.5px);
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.8px;
      line-height: 1.4;
    }

    .signature-roles span.role-highlight {
      color: var(--accent-gold);
      font-weight: 700;
    }

    .cover-action-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
      gap: 14px;
    }

    .btn-launch-large {
      font-family: 'Inter', sans-serif;
      font-size: clamp(14px, 1.05vw, 16.5px);
      font-weight: 800;
      padding: 15px 32px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid rgba(96, 165, 250, 0.5);
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-launch-large:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.55);
    }

    /* CURRICULUM STAGE */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 40px 24px;
      flex: 1;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
    }

    .center-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-blue-light);
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.35);
      padding: 6px 18px;
      border-radius: 9999px;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .center-title {
      font-size: clamp(26px, 2.6vw, 38px);
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.25;
      font-family: 'Space Grotesk', sans-serif;
    }

    .exam-grid-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 26px 30px;
      width: 100%;
      box-shadow: var(--shadow-deep);
      text-align: left;
      margin-top: 24px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      background: var(--bg-card-inner);
      border: 1.5px solid var(--border-subtle);
      border-radius: 12px;
      gap: 20px;
      transition: all 0.2s ease;
    }

    .mock-row.available {
      border-color: rgba(37, 99, 235, 0.5);
      border-left: 6px solid var(--accent-blue);
    }

    .mock-row.available:hover {
      border-color: var(--accent-blue-light);
      background: rgba(16, 29, 54, 0.95);
      transform: translateY(-1px);
    }

    .mock-row.completed {
      border-color: rgba(16, 185, 129, 0.5);
      border-left: 6px solid var(--success);
    }

    .mock-row.locked {
      opacity: 0.45;
      filter: grayscale(0.6);
      cursor: not-allowed;
    }

    .mock-main-info h4 {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 4px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .mock-main-info p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .paper-breakdown-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .tag-paper {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      background: rgba(10, 19, 36, 0.8);
      color: #cbd5e1;
    }

    .tag-paper.gold {
      border-color: rgba(212, 175, 55, 0.4);
      color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.1);
    }

    .tag-paper.blue {
      border-color: rgba(96, 165, 250, 0.4);
      color: var(--accent-blue-light);
      background: rgba(37, 99, 235, 0.12);
    }

    .tag-paper.green {
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--success);
      background: rgba(16, 185, 129, 0.1);
    }

    .btn-mock-action {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      padding: 12px 22px;
      border-radius: 8px;
      border: 1.5px solid var(--accent-blue-light);
      background: rgba(37, 99, 235, 0.3);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn-mock-action:hover {
      background: var(--accent-blue);
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.7);
      transform: translateY(-1px);
    }

    .btn-mock-action.review {
      border-color: rgba(16, 185, 129, 0.6);
      background: rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
    }

    .btn-mock-action.review:hover {
      background: var(--success);
      color: #040914;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
    }

    .bottom-bar {
      padding: 20px 42px;
      background: rgba(6, 12, 23, 0.95);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .btn-act {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 24px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border-subtle);
      color: #cbd5e1;
    }

    .btn-outline:hover {
      background: var(--bg-card);
      color: #ffffff;
      border-color: var(--accent-blue-light);
    }

    .institutional-bottom {
      padding: 12px 40px;
      background: #03060d;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: #64748b;
    }

    .institutional-bottom strong {
      color: #cbd5e1;
    }

    @media (max-width: 900px) {
      .cover-fullscreen {
        padding: 32px 20px 24px 20px;
      }
      .top-nav {
        padding: 0 18px;
      }
      .bottom-bar {
        padding: 14px 20px;
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      .cover-bottom-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }
      .mock-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .btn-mock-action {
        width: 100%;
        justify-content: center;
      }
      .institutional-bottom {
        flex-direction: column;
        gap: 6px;
        text-align: center;
        padding: 14px 18px;
      }
    }
  </style>
</head>
<body>

  <div id="app-viewport">
    
    <!-- TOP NAVIGATION -->
    <header class="top-nav" id="topNav" style="display: none;">
      <div class="nav-brand-left">
        <div class="cambridge-badge">
          <svg class="cambridge-shield" viewBox="0 0 24 24">
            <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66c0 4.14-2.73 8.02-6 9.11-3.27-1.09-6-4.97-6-9.11V6.43l6-2.25z"/>
          </svg>
          <span class="cambridge-name">Cambridge</span>
          <span class="cambridge-level">B2</span>
        </div>
        <span class="nav-title">B2 First: Complete Exam Roadmap Hub</span>
      </div>

      <div class="nav-brand-right">
        <div class="coin-display">
          <span>🪙</span> <span id="navCoins">100</span>
        </div>
        <div class="candidate-badge" id="navCandidate">Candidate Active</div>
      </div>
    </header>

    <!-- MOUNT CONTAINER -->
    <div class="screen-container" id="mountNode"></div>

    <!-- INSTITUTIONAL FOOTER -->
    <footer class="institutional-bottom">
      <span>Cambridge B2 First: Full Mock Examination Series • Reading, Use of English, Writing & Listening</span>
      <span>All Rights Reserved © by <strong>Dr. Jesús Miguel Lima E.</strong> • JM ELT Solutions</span>
    </footer>

  </div>

  <script>
    const STORAGE_KEY = "fce_master_exam_suite_v1";
    let activeScreen = 1;

    let session = {
      candidateName: "Candidate",
      coins: 100,
      mockScores: {}
    };

    function initData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          session = { ...session, ...parsed };
        } catch (e) {
          console.error("Error reading session:", e);
        }
      }
      syncStorage();
    }

    function syncStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
      const elCoins = document.getElementById('navCoins');
      if (elCoins) elCoins.innerText = session.coins || 100;
      const elName = document.getElementById('navCandidate');
      if (elName && session.candidateName) elName.innerText = session.candidateName;
    }

    function setScreen(step) {
      activeScreen = step;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateToExam(url) {
      syncStorage();
      window.location.href = url;
    }

    function render() {
      const mount = document.getElementById('mountNode');
      const nav = document.getElementById('topNav');
      mount.innerHTML = '';

      if (activeScreen === 1) {
        nav.style.display = 'none';
        renderCover(mount);
      } else if (activeScreen === 2) {
        nav.style.display = 'flex';
        renderCurriculum(mount);
      }
      syncStorage();
    }

    function renderCover(mount) {
      mount.innerHTML = `
        <div class="slide">
          <div class="cover-fullscreen">
            <div>
              <div class="cover-top-badge-row">
                <div class="cambridge-badge" style="padding: 6px 14px;">
                  <svg class="cambridge-shield" style="width:19px; height:19px;" viewBox="0 0 24 24">
                    <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66c0 4.14-2.73 8.02-6 9.11-3.27-1.09-6-4.97-6-9.11V6.43l6-2.25z"/>
                  </svg>
                  <span class="cambridge-name" style="font-size:15px;">Cambridge English</span>
                  <span class="cambridge-level" style="font-size:10px; margin-top:-4px;">B2 FIRST</span>
                </div>

                <div class="candidate-badge" style="font-size:12px; padding:6px 14px;">
                  Official Test Architecture
                </div>
              </div>

              <div class="cover-headings-group">
                <div class="main-section-title">OFFICIAL CAMBRIDGE B2 FIRST (FCE) EXAMINATION</div>
                <div class="main-task-title">"COMPLETE FINAL MOCK SUITE"</div>
              </div>

              <div class="welcome-text-block">
                <p class="welcome-en">
                  Welcome to the comprehensive, full-length Cambridge B2 First Examination Simulator. Experience authentic, timed exam sessions structured in Cambridge's official sitting order: <strong>Paper 1 (Reading & Use of English - 75 mins)</strong>, <strong>Paper 2 (Writing - 80 mins)</strong>, and <strong>Paper 3 (Listening - 45 mins)</strong>.
                </p>
                <p class="welcome-en" style="color: #94a3b8; font-size: clamp(14px, 1.05vw, 16px);">
                  Complete automated diagnostic feedback, real-time writing metrics, audio stream synchronization, and consolidated final scorecard documentation.
                </p>
              </div>
            </div>

            <div class="cover-bottom-row">
              <div class="signature-container">
                <div class="signature-name-wrapper">
                  <span class="signature-name">by Dr. Jesús Miguel Lima E.</span>
                </div>
                <div class="signature-roles">
                  <span class="role-highlight">CEO of JM ELT Solutions</span>
                  <span>Celta & Delta Certified Trainer</span>
                  <span>Cambridge Examination Specialist</span>
                  <span>Teacher Educator & University Professor</span>
                </div>
              </div>

              <div class="cover-action-wrapper">
                <button class="btn-launch-large" onclick="setScreen(2)">
                  <span>📑</span> Open Examination Hub ➔
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function renderCurriculum(mount) {
      const mockList = [
        {
          id: 1,
          key: "final_mock_01",
          title: "Cambridge B2 First • Complete Final Mock Exam 01",
          desc: "Full Sitting: Reading & Use of English (Parts 1–7) • Writing (Essay + Option) • Listening (Parts 1–4, Audio Stream).",
          papers: [
            { label: "Paper 1: R&UoE (75m)", class: "blue" },
            { label: "Paper 2: Writing (80m)", class: "gold" },
            { label: "Paper 3: Listening (45m)", class: "green" }
          ],
          fileName: "./FINAL MOCK 01 - B2 FIRST COMPLETE.html"
        },
        {
          id: 2,
          key: "final_mock_02",
          title: "Cambridge B2 First • Complete Final Mock Exam 02",
          desc: "Full Sitting: Standard Cambridge B2 Suite • Diagnostic Scoring & Evaluation Module.",
          papers: [
            { label: "Paper 1: R&UoE", class: "blue" },
            { label: "Paper 2: Writing", class: "gold" },
            { label: "Paper 3: Listening", class: "green" }
          ],
          fileName: "#"
        },
        {
          id: 3,
          key: "final_mock_03",
          title: "Cambridge B2 First • Complete Final Mock Exam 03",
          desc: "Full Sitting: Advanced Lexical Profiling • Authentic Audioscripts & Writing Analyzer.",
          papers: [
            { label: "Paper 1: R&UoE", class: "blue" },
            { label: "Paper 2: Writing", class: "gold" },
            { label: "Paper 3: Listening", class: "green" }
          ],
          fileName: "#"
        }
      ];

      const rowsHtml = mockList.map(m => {
        const scoreData = session.mockScores && session.mockScores[m.key];
        const isCompleted = scoreData && scoreData.completed;
        const isAvailable = (m.id === 1);

        let rowClass = "locked";
        let actionBtn = `<div style="font-family:'JetBrains Mono'; font-size:12px; font-weight:700; color:var(--text-muted);">🔒 LOCKED</div>`;

        if (isCompleted) {
          rowClass = "completed";
          actionBtn = `
            <button class="btn-mock-action review" onclick="navigateToExam('${m.fileName}')">
              <span>↺</span> Review Full Mock
            </button>
          `;
        } else if (isAvailable) {
          rowClass = "available";
          actionBtn = `
            <button class="btn-mock-action" onclick="navigateToExam('${m.fileName}')">
              <span>▶</span> Launch Complete Mock ➔
            </button>
          `;
        }

        const tagsHtml = m.papers.map(p => `<span class="tag-paper ${p.class}">${p.label}</span>`).join('');
        const scoreBadge = isCompleted 
          ? `<span class="tag-paper green" style="margin-left: 8px;">Completed Score: ${scoreData.totalScore || '--'}</span>` 
          : '';

        return `
          <div class="mock-row ${rowClass}">
            <div class="mock-main-info">
              <h4>${m.title}</h4>
              <p>${m.desc}</p>
              <div class="paper-breakdown-tags">
                ${tagsHtml}
                ${scoreBadge}
              </div>
            </div>
            <div>
              ${actionBtn}
            </div>
          </div>
        `;
      }).join('');

      mount.innerHTML = `
        <div class="slide">
          <div class="center-stage">
            <div class="center-tag"><span>🎯</span> CAMBRIDGE EXAMINATION ARCHITECTURE</div>
            <h2 class="center-title">CAMBRIDGE B2 FIRST • FULL MOCK EXAMS HUB</h2>
            <div style="max-width: 820px; margin-bottom: 6px;">
              <p style="font-size:15px; color:#cbd5e1; line-height:1.6;">
                Each Final Mock simulates the full Cambridge testing protocol. Progress through the papers in authentic examination sequence. Your consolidated scores will be computed and archived upon completion.
              </p>
            </div>

            <div class="exam-grid-card">
              ${rowsHtml}
            </div>
          </div>

          <div class="bottom-bar">
            <button class="btn-act btn-outline" onclick="setScreen(1)">
              <span>⬅</span> Back to Welcome Screen
            </button>
            <div style="font-family:'JetBrains Mono'; font-size:12px; color:var(--text-muted);">
              Official Papers: Reading & Use of English (75m) • Writing (80m) • Listening (~45m)
            </div>
          </div>
        </div>
      `;
    }

    initData();
    render();
  </script>
</body>
</html>
